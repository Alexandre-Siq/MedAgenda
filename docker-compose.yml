services:
  postgres:
    image: postgres:16-alpine
    container_name: medagenda-postgres
    environment:
      POSTGRES_DB: medagenda
      POSTGRES_USER: medagenda
      POSTGRES_PASSWORD: medagenda
    ports:
      - "5432:5432"
    volumes:
      - medagenda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medagenda -d medagenda"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  medagenda-postgres-data:
