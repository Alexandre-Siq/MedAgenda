spring:
  application:
    name: medagenda-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/medagenda}
    username: ${DATABASE_USERNAME:medagenda}
    password: ${DATABASE_PASSWORD:medagenda}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:medagenda-development-secret-key-please-change-1234567890}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
